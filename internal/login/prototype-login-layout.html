<!doctype html>
<!-- PROTOTYPE (throwaway, issue #70): identifier-first login flow + five brand-panel
     variants, switchable via ?variant=A..E or the bottom bar / ← →. Double-click to open.
     No backend: sending a code, altcha and password checks are stubs. Any 6 digits / any
     password succeed. Never merge into main. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Stars Auth(原型)</title>
<style>
:root {
  --primary: #7048e8; --primary-hover: #5f37d6; --primary-soft: #f5f0ff; --primary-ink: #6236d9; --primary-foreground: #fff;
  --star: #f0609e; --canvas: #f7f4fa; --panel: #fff;
  --ink: #211b2c; --muted: #6e677d; --faint: #a8a1b6; --line: #efebf4; --danger: #d33;
  font: 14px/1.5 Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink); background: var(--panel); -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; grid-template-columns: 1fr 1fr; }
.brand { position: relative; overflow: hidden; background: var(--primary-soft); padding: 48px; }
.brand > .logo { position: relative; display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; z-index: 2; }
.brand svg.sky { position: absolute; inset: 0; width: 100%; height: 100%; }
.star { fill: var(--star); width: 24px; height: 24px; }
.form { display: grid; place-items: center; padding: 56px 32px; }
main { width: 100%; max-width: 340px; }
main > .star { width: 32px; height: 32px; }
h1 { margin: 24px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
h1 + p { margin-top: 4px; }
p { color: var(--muted); margin: 16px 0; }
form p { margin: 0; }
p b { color: var(--ink); font-weight: 500; }
form { display: grid; gap: 16px; margin-top: 32px; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
input, button { font: inherit; font-size: 14px; color: inherit; border-radius: 8px; }
input:not([type=checkbox]) { padding: 9px 12px; border: 1px solid var(--line); outline: none; }
input:not([type=checkbox]):focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
button { cursor: pointer; padding: 10px 12px; font-weight: 500; border: 0; background: var(--primary); color: var(--primary-foreground); }
button:hover { background: var(--primary-hover); }
a { color: var(--primary-ink); cursor: pointer; }
.links { display: flex; justify-content: space-between; font-size: 13px; }
.who { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 8px; background: var(--canvas); font-size: 14px; }
.who a { font-size: 13px; }
.error { color: var(--danger); font-size: 13px; }
.note { font-size: 12px; color: var(--faint); }
label.agree { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; font-weight: 400; color: var(--muted); }
label.agree a { text-decoration: none; }
label.agree input { margin: 3px 0 0; accent-color: var(--primary); }
.by { margin-top: 40px; text-align: center; font-size: 12px; color: var(--faint); }

/* C: big star mark */
.bigstar { position: absolute; width: 74%; right: -14%; bottom: -10%; fill: var(--star); opacity: .14; }
.bigstar.b2 { width: 16%; right: auto; left: 18%; bottom: auto; top: 30%; opacity: .5; }
/* D: copy */
.copy { position: absolute; left: 48px; right: 48px; bottom: 56px; z-index: 2; }
.copy h2 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
.copy p { margin: 8px 0 0; font-size: 14px; }

@media (max-width: 767px) {
  body { grid-template-columns: 1fr; }
  .brand { display: none; }
  .form { padding: 40px 16px; }
}

/* prototype chrome, not part of the design */
.proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: #111; color: #fff; font: 13px system-ui; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.proto-bar button { background: none; padding: 4px 10px; border-radius: 999px; }
.proto-bar button:hover { background: #333; }
.proto-bar span { padding: 0 8px; min-width: 200px; text-align: center; }
.proto-panel { position: fixed; right: 12px; top: 12px; z-index: 10; width: 220px; padding: 10px 12px; border-radius: 8px; background: #111; color: #ddd; font: 12px/1.6 ui-monospace, monospace; opacity: .9; }
.proto-panel label { display: flex; gap: 6px; font: inherit; color: #fff; }
.proto-panel pre { margin: 6px 0 0; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="brand" id="brand" aria-hidden="true"></div>
<div class="form">
<main>
<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.7 6.2 4.3 9.8 10.5 10.5-6.2.7-9.8 4.3-10.5 10.5-.7-6.2-4.3-9.8-10.5-10.5C7.7 11.3 11.3 7.7 12 1.5Z"/></svg>
<h1>登录</h1>
<p>继续前往 <b>星图笔记</b></p>
<div id="step"></div>
<p class="by">由 Stars 提供安全登录</p>
</main>
</div>

<div class="proto-bar"><button id="prev">←</button><span id="vlabel"></span><button id="next">→</button></div>
<div class="proto-panel">
  <b>原型控制</b>
  <label><input type="checkbox" id="codeOn" checked> 验证码登录开启</label>
  <label><input type="checkbox" id="pwdOn" checked> 密码登录开启</label>
  <pre id="state"></pre>
</div>

<script>
const STAR = 'M12 1.5c.7 6.2 4.3 9.8 10.5 10.5-6.2.7-9.8 4.3-10.5 10.5-.7-6.2-4.3-9.8-10.5-10.5C7.7 11.3 11.3 7.7 12 1.5Z';
const LOGO = `<div class="logo"><svg class="star" viewBox="0 0 24 24"><path d="${STAR}"/></svg>Stars</div>`;

// seeded random so variants look the same on every reload
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function dots(n, rMin, rMax, oMin, oMax) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const r = rMin + rnd() ** 3 * (rMax - rMin);
    s += `<circle cx="${(rnd() * 100).toFixed(1)}%" cy="${(rnd() * 100).toFixed(1)}%" r="${r.toFixed(2)}" opacity="${(oMin + rnd() * (oMax - oMin)).toFixed(2)}"/>`;
  }
  return s;
}
// four-point sparkle centred on (x%, y%) — drawn as a nested svg so % positioning works
const sparkle = (x, y, size, op) =>
  `<svg x="${x}%" y="${y}%" width="${size}" height="${size}" viewBox="0 0 24 24" overflow="visible" opacity="${op}"><path transform="translate(-12 -12)" d="${STAR}"/></svg>`;

const VARIANTS = {
  A: { name: '繁星:更密的星空', html() {
    seed = 7;
    return `<svg class="sky" fill="var(--star)">${dots(420, .4, 1.8, .2, .6)}${dots(50, 1.4, 2.8, .5, .9)}
      ${sparkle(22, 30, 14, .8)}${sparkle(71, 18, 10, .7)}${sparkle(58, 66, 16, .85)}${sparkle(84, 82, 9, .6)}${sparkle(12, 74, 11, .7)}</svg>${LOGO}`;
  }},
  B: { name: '星座:连线的星座', html() {
    seed = 11;
    // two constellations, coordinates in a 100x100 viewBox stretched to the panel
    const groups = [
      [[18,28],[30,22],[42,30],[50,24],[62,33],[58,46],[44,44],[42,30]],
      [[30,70],[44,62],[56,72],[70,64],[84,74],[70,64],[74,50]],
    ];
    let lines = '', stars = '';
    for (const g of groups) {
      lines += `<polyline points="${g.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--star)" stroke-opacity=".35" stroke-width=".25" vector-effect="non-scaling-stroke" style="stroke-width:1px"/>`;
      for (const [x, y] of g) stars += sparkle(x, y, 12, .9);
    }
    return `<svg class="sky" fill="var(--star)">${dots(160, .3, 1.1, .15, .45)}</svg>
      <svg class="sky" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>
      <svg class="sky" fill="var(--star)">${stars}</svg>${LOGO}`;
  }},
  C: { name: '大星标:放大的星形标志', html() {
    seed = 3;
    return `<svg class="sky" fill="var(--star)">${dots(140, .3, 1.3, .2, .6)}</svg>
      <svg class="bigstar" viewBox="0 0 24 24"><path d="${STAR}"/></svg>
      <svg class="bigstar b2" viewBox="0 0 24 24"><path d="${STAR}"/></svg>${LOGO}`;
  }},
  D: { name: '星云:渐变光晕 + 星点', html() {
    seed = 5;
    return `<svg class="sky"><defs>
        <radialGradient id="n1"><stop offset="0" stop-color="#b197fc" stop-opacity=".55"/><stop offset="1" stop-color="#b197fc" stop-opacity="0"/></radialGradient>
        <radialGradient id="n2"><stop offset="0" stop-color="#f0609e" stop-opacity=".35"/><stop offset="1" stop-color="#f0609e" stop-opacity="0"/></radialGradient></defs>
      <ellipse cx="35%" cy="40%" rx="55%" ry="32%" fill="url(#n1)"/><ellipse cx="68%" cy="64%" rx="42%" ry="26%" fill="url(#n2)"/>
      <g fill="var(--star)">${dots(220, .3, 1.5, .2, .65)}${sparkle(40, 38, 18, .9)}${sparkle(66, 62, 12, .8)}${sparkle(24, 70, 9, .7)}</g></svg>${LOGO}`;
  }},
  E: { name: '文案:星空 + 中性说明', html() {
    seed = 7;
    return `<svg class="sky" fill="var(--star)">${dots(260, .3, 1.4, .15, .55)}
      ${sparkle(30, 26, 14, .8)}${sparkle(74, 20, 10, .7)}${sparkle(62, 48, 16, .85)}</svg>${LOGO}
      <div class="copy"><h2>一个账号,<br>登录 Stars 全家产品</h2><p>手机号、邮箱或用户名,任选其一。</p></div>`;
  }},
};
const KEYS = Object.keys(VARIANTS);
let variant = new URLSearchParams(location.search).get('variant') || 'A';
function showVariant(k) {
  variant = k;
  document.getElementById('brand').innerHTML = VARIANTS[k].html();
  document.getElementById('vlabel').textContent = `${k} (${VARIANTS[k].name})`;
  const u = new URL(location); u.searchParams.set('variant', k); history.replaceState(null, '', u);
}
const cycle = d => showVariant(KEYS[(KEYS.indexOf(variant) + d + KEYS.length) % KEYS.length]);
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

// ---- flow ----
// step: 'id' (identifier only, code path) | 'pwdForm' (identifier + password)
//     | 'code' (enter code) | 'pwd' (password for a known identifier)
const S = { codeOn: true, pwdOn: true, step: 'id', identifier: '', agreed: false, error: '', sent: [] };
const kind = v => /^1\d{10}$/.test(v) ? '手机号' : /^[^@\s]+@[^@\s]+$/.test(v) ? '邮箱' : '用户名';
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);

function firstStep() { return S.codeOn ? 'id' : 'pwdForm'; }
const AGREE = () => `<label class="agree"><input type="checkbox" name="agree" required ${S.agreed ? 'checked' : ''}><span>我已阅读并同意<a>《用户协议》</a>和<a>《隐私政策》</a></span></label>`;
const ERR = () => S.error ? `<p class="error" role="alert">${S.error}</p>` : '';
const WHO = () => `<div class="who"><span>${esc(S.identifier)}</span><a data-go="change">更换账号</a></div>`;

const STEPS = {
  id: () => `${ERR()}<form data-op="continue">
    <label>手机号、邮箱或用户名<input name="identifier" autocomplete="username" autocapitalize="none" required autofocus value="${esc(S.identifier)}"></label>
    ${AGREE()}
    <button>继续</button>
    ${S.pwdOn ? `<div class="links"><a data-go="pwdForm">使用密码登录</a></div>` : ''}
  </form>`,
  pwdForm: () => `${ERR()}<form data-op="password">
    <label>手机号、邮箱或用户名<input name="identifier" autocomplete="username" autocapitalize="none" required ${S.identifier ? '' : 'autofocus'} value="${esc(S.identifier)}"></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required ${S.identifier ? 'autofocus' : ''}></label>
    ${AGREE()}
    <button>登录</button>
    ${S.codeOn ? `<div class="links"><a data-go="id">改用验证码登录</a></div>` : ''}
  </form>`,
  code: () => `${ERR()}<form data-op="verify">
    ${WHO()}
    <p>验证码已发送至 ${esc(S.identifier)},5 分钟内有效。</p>
    <label>验证码<input name="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus></label>
    <button>登录</button>
    <div class="links"><a data-go="resend">重新获取</a></div>
  </form>`,
  pwd: () => `${ERR()}<form data-op="password">
    ${WHO()}
    <input type="hidden" name="identifier" value="${esc(S.identifier)}">
    <label>密码<input name="password" type="password" autocomplete="current-password" required autofocus></label>
    <button>登录</button>
  </form>`,
  done: () => `<p>✓ 登录成功(原型到此为止)。</p><div class="links"><a data-go="change">重来</a></div>`,
};

function render() {
  if (!S.codeOn && !S.pwdOn) document.getElementById('step').innerHTML = '<p class="error">两种方式都关了,登录页无法使用。</p>';
  else document.getElementById('step').innerHTML = STEPS[S.step]();
  document.getElementById('state').textContent = JSON.stringify({ ...S, sent: S.sent.slice(-3) }, null, 1).replace(/[{}"]/g, '').trim();
  document.querySelector('#step [autofocus]')?.focus();
}

document.getElementById('step').addEventListener('click', e => {
  const go = e.target.closest('[data-go]')?.dataset.go;
  if (!go) return;
  S.error = '';
  const typed = document.querySelector('#step input[name=identifier]');
  if (typed && typed.type !== 'hidden') S.identifier = typed.value.trim();
  if (go === 'change') { S.step = firstStep(); S.identifier = ''; }
  else if (go === 'resend') S.sent.push(`码 → ${S.identifier}(altcha 先运行)`);
  else S.step = go;
  render();
});

document.getElementById('step').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target), op = e.target.dataset.op;
  S.error = '';
  if (f.has('agree')) S.agreed = true; // later steps carry it as a hidden field
  if (f.has('identifier')) S.identifier = f.get('identifier').trim();
  if (op === 'continue') {
    if (kind(S.identifier) === '用户名') {
      if (S.pwdOn) S.step = 'pwd';
      else S.error = '该账号不能用验证码登录。'; // same text whether or not it exists
    } else {
      S.sent.push(`altcha 运行 → 码发往${kind(S.identifier)} ${S.identifier}`);
      S.step = 'code';
    }
  } else if (op === 'verify') S.step = 'done';
  else if (op === 'password') { S.sent.push('密码登录:不发码、不跑 altcha'); S.step = 'done'; }
  render();
});

for (const id of ['codeOn', 'pwdOn']) document.getElementById(id).onchange = e => {
  S[id] = e.target.checked; S.step = firstStep(); S.error = ''; render();
};

showVariant(VARIANTS[variant] ? variant : 'A');
render();
</script>
</body>
</html>
