services:
  # This is a copy of the docker compose from the conformance suite repository
  # with some changes that allow the suite to call an authorization server running
  # on localhost.
  # The auth server is expected to be running under the domain "auth.localhost".
  # CS_DIR is the built conformance-suite checkout (see run.sh).
  mongodb:
    image: mongo:6.0.13
  # The harness OP's database (internal/oidcstore).
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: pg
    ports:
     - "127.0.0.1:55433:5432"
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
  nginx:
    build:
      context: ${CS_DIR:?}/nginx
      dockerfile: Dockerfile-static
    ports:
     - "8443:8443"
     - "8444:8444"
     - "8445:8445"
    volumes:
     - ${CS_DIR:?}/src/main/resources/:/usr/share/nginx/html/
    depends_on:
     - server
  server:
    build:
      context: ${CS_DIR:?}/server-dev
    ports:
     - "9999:9999"
    volumes:
     - ${CS_DIR:?}/target/:/server/
    command: >
      java
      -Xdebug -Xrunjdwp:transport=dt_socket,address=*:9999,server=y,suspend=n
      -jar /server/fapi-test-suite.jar
      -Djdk.tls.maxHandshakeMessageSize=65536
      --fintechlabs.base_url=https://localhost.emobix.co.uk:8443
      --fintechlabs.base_mtls_url=https://localhost.emobix.co.uk:8444
      --fintechlabs.devmode=true
      --fintechlabs.startredir=true
    links:
     - mongodb:mongodb
    depends_on:
     - mongodb
    logging:
      # limit logs retained on host
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"
    extra_hosts:
      # Requests to auth.localhost and matls-auth.localhost are forwarded to the
      # docker host where the authorization server is running.
      - auth.localhost:host-gateway
      - localhost.emobix.co.uk:host-gateway
      # The suite's pages pull CSS/JS from public CDNs; a slow CDN stalls its
      # headless browser past the auth code lifetime. Refuse them instantly.
      - cdn.jsdelivr.net:127.0.0.1
      - cdnjs.cloudflare.com:127.0.0.1
      - cdn.datatables.net:127.0.0.1
      - oss.maxcdn.com:127.0.0.1
      - fonts.googleapis.com:127.0.0.1
      - fonts.gstatic.com:127.0.0.1
